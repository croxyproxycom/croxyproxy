{% if page.faq %}<section class="alt"><div class="wrap"><h2>Frequently asked questions</h2>
{% for q in page.faq %}<details><summary>{{ q.q }}</summary><p>{{ q.a }}</p></details>
{% endfor %}</div></section>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{% for q in page.faq %}{"@type":"Question","name":{{ q.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ q.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>{% endif %}
